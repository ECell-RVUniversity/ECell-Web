name: Deploy to Vercel

on:
  push:
    branches:
      - main

permissions:
  contents: read
  deployments: write

env:
  VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
  VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}

jobs:
  deploy:
    name: Production Deployment
    runs-on: ubuntu-latest

    steps:
      - name: Create GitHub deployment
        id: deployment
        uses: actions/github-script@v7
        with:
          script: |
            const deployment = await github.rest.repos.createDeployment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              ref: context.sha,
              environment: 'Production',
              description: 'Vercel production deployment',
              auto_merge: false,
              required_contexts: []
            });

            core.setOutput('id', deployment.data.id);

      - name: Mark deployment as in progress
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.repos.createDeploymentStatus({
              owner: context.repo.owner,
              repo: context.repo.repo,
              deployment_id: '${{ steps.deployment.outputs.id }}',
              state: 'in_progress',
              description: 'Deploying to Vercel...'
            });

      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Install Vercel CLI
        run: npm install --global vercel@latest

      - name: Pull Vercel Production Environment
        run: |
          vercel pull \
            --yes \
            --environment=production \
            --token="${{ secrets.VERCEL_TOKEN }}"

      - name: Build Vercel Project
        run: |
          vercel build \
            --prod \
            --token="${{ secrets.VERCEL_TOKEN }}"

      - name: Deploy to Vercel
        id: vercel
        run: |
          URL=$(vercel deploy \
            --prebuilt \
            --prod \
            --token="${{ secrets.VERCEL_TOKEN }}")

          echo "url=$URL" >> "$GITHUB_OUTPUT"

      - name: Mark GitHub deployment successful
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.repos.createDeploymentStatus({
              owner: context.repo.owner,
              repo: context.repo.repo,
              deployment_id: '${{ steps.deployment.outputs.id }}',
              state: 'success',
              environment_url: '${{ steps.vercel.outputs.url }}',
              description: 'Successfully deployed to Vercel'
            });

      - name: Mark GitHub deployment failed
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.repos.createDeploymentStatus({
              owner: context.repo.owner,
              repo: context.repo.repo,
              deployment_id: '${{ steps.deployment.outputs.id }}',
              state: 'failure',
              description: 'Vercel deployment failed'
            });